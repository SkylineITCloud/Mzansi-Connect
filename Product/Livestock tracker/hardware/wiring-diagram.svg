<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <linearGradient id="esp32-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="gps-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="gsm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
    <linearGradient id="bat-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#ca6f1e"/>
    </linearGradient>
    <linearGradient id="solar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d4ac0e"/>
    </linearGradient>
    <linearGradient id="reg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">LiveStock GPS Tracker — Wiring Diagram</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d">ESP32 + NEO-6M GPS + SIM800L GSM + TP4056 LiPo Charger + Solar</text>

  <!-- ====== COMPONENT BLOCKS ====== -->

  <!-- Legend -->
  <rect x="25" y="830" width="380" height="60" rx="8" fill="white" stroke="#ccc" stroke-width="1.5"/>
  <text x="40" y="852" font-size="13" font-weight="bold" fill="#2c3e50">Cable Legend:</text>
  <line x1="40" y1="870" x2="80" y2="870" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="85" y="874" font-size="12" fill="#e74c3c">Power (VCC 3.3V/5V)</text>
  <line x1="190" y1="870" x2="230" y2="870" stroke="#333" stroke-width="2"/>
  <text x="235" y="874" font-size="12" fill="#333">GND</text>
  <line x1="310" y1="870" x2="350" y2="870" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="355" y="874" font-size="12" fill="#3498db">Data (TX / RX)</text>

  <!-- ====== 1. ESP32 ====== -->
  <g filter="url(#shadow)">
    <rect x="350" y="100" width="260" height="280" rx="12" fill="url(#esp32-bg)"/>
    <text x="480" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="white">ESP32-WROOM-32</text>
    <text x="480" y="148" text-anchor="middle" font-size="11" fill="#b0bec5">Microcontroller &amp; WiFi + BLE</text>

    <!-- Pin rows -->
    <line x1="360" y1="170" x2="600" y2="170" stroke="#34495e" stroke-width="1"/>
    <text x="355" y="195" text-anchor="end" font-size="11" fill="#ecf0f1">EN</text>
    <text x="605" y="195" font-size="11" fill="#ecf0f1">GPIO23</text>
    <line x1="360" y1="205" x2="600" y2="205" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="230" text-anchor="end" font-size="11" fill="#ecf0f1">GPIO36 (VP)</text>
    <text x="605" y="230" font-size="11" fill="#ecf0f1">GPIO22</text>
    <line x1="360" y1="240" x2="600" y2="240" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="265" text-anchor="end" font-size="11" fill="#ecf0f1">GPIO39 (VN)</text>
    <text x="605" y="265" font-size="11" fill="#ecf0f1">GPIO1 (TX0)</text>
    <line x1="360" y1="275" x2="600" y2="275" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="300" text-anchor="end" font-size="11" fill="#ecf0f1">GPIO34 (ADC)</text>
    <text x="605" y="300" font-size="11" fill="#ecf0f1">GPIO3 (RX0)</text>
    <line x1="360" y1="310" x2="600" y2="310" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="335" text-anchor="end" font-size="11" fill="#ecf0f1">GPIO15 (RTC)</text>
    <text x="605" y="335" font-size="11" fill="#ecf0f1">GPIO21</text>
    <line x1="360" y1="345" x2="600" y2="345" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="360" text-anchor="end" font-size="11" fill="#ecf0f1">GND</text>
    <text x="605" y="360" font-size="11" fill="#ecf0f1">GPIO19 (GSM TX)</text>
    <line x1="360" y1="370" x2="600" y2="370" stroke="#34495e" stroke-width="1"/>

    <text x="355" y="375" text-anchor="end" font-size="11" fill="#e74c3c">3V3</text>
    <text x="605" y="375" font-size="11" fill="#ecf0f1">GPIO18 (GSM RX)</text>
  </g>

  <!-- UART2 pins (for GPS) -->
  <rect x="615" y="105" width="10" height="85" rx="2" fill="#3498db" opacity="0.6"/>
  <text x="617" y="135" font-size="9" fill="white" transform="rotate(-90, 617, 135)">GPIO16 (GPS RX)</text>
  <rect x="615" y="145" width="10" height="40" rx="2" fill="#e67e22" opacity="0.6"/>
  <text x="617" y="170" font-size="9" fill="white" transform="rotate(-90, 617, 170)">GPIO17 (GPS TX)</text>

  <!-- ====== 2. GPS MODULE ====== -->
  <g filter="url(#shadow)">
    <rect x="55" y="140" width="200" height="170" rx="10" fill="url(#gps-bg)"/>
    <text x="155" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="white">NEO-6M / NEO-8M</text>
    <text x="155" y="185" text-anchor="middle" font-size="11" fill="#d5f5e3">GPS Module (u-blox)</text>

    <text x="70" y="215" font-size="11" fill="white">VCC  → 3.3V</text>
    <text x="70" y="235" font-size="11" fill="white">GND</text>
    <text x="70" y="255" font-size="11" fill="white">TX  → GPIO16 (ESP32 RX2)</text>
    <text x="70" y="275" font-size="11" fill="white">RX  → GPIO17 (ESP32 TX2)</text>
    <text x="70" y="295" font-size="11" fill="#f9e79f">PPS  → (optional, NC)</text>
  </g>

  <!-- ====== 3. SIM800L GSM MODULE ====== -->
  <g filter="url(#shadow)">
    <rect x="740" y="140" width="200" height="170" rx="10" fill="url(#gsm-bg)"/>
    <text x="840" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="white">SIM800L</text>
    <text x="840" y="185" text-anchor="middle" font-size="11" fill="#e8daef">GSM/GPRS Module</text>

    <text x="755" y="215" font-size="11" fill="white">VCC  → 3.7V–4.2V (BAT)</text>
    <text x="755" y="235" font-size="11" fill="white">GND</text>
    <text x="755" y="255" font-size="11" fill="white">TX  → GPIO19 (ESP32 RX)</text>
    <text x="755" y="275" font-size="11" fill="white">RX  → GPIO18 (ESP32 TX)</text>
    <text x="755" y="295" font-size="11" fill="#f9e79f">RST  → (via 10k pull-up)</text>
  </g>

  <!-- ====== 4. TP4056 LiPo Charger ====== -->
  <g filter="url(#shadow)">
    <rect x="55" y="440" width="220" height="170" rx="10" fill="url(#bat-bg)"/>
    <text x="165" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="white">TP4056</text>
    <text x="165" y="485" text-anchor="middle" font-size="11" fill="#fdebd0">LiPo Charger (1A)</text>

    <text x="70" y="515" font-size="11" fill="white">IN+  → Solar Panel 5V</text>
    <text x="70" y="535" font-size="11" fill="white">IN-  → GND</text>
    <text x="70" y="555" font-size="11" fill="white">BAT+ → LiPo + / ESP32 VIN</text>
    <text x="70" y="575" font-size="11" fill="white">BAT- → GND</text>
    <text x="70" y="595" font-size="11" fill="#f9e79f">Standalone; OUT+ already regulated</text>
  </g>

  <!-- ====== 5. LiPo Battery ====== -->
  <g filter="url(#shadow)">
    <rect x="370" y="440" width="220" height="130" rx="10" fill="url(#bat-bg)"/>
    <text x="480" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="white">LiPo Battery</text>
    <text x="480" y="490" text-anchor="middle" font-size="11" fill="#fdebd0">3.7V 5000 mAh</text>
    <text x="390" y="520" font-size="11" fill="white">Red  → BAT+ (TP4056 / VIN)</text>
    <text x="390" y="540" font-size="11" fill="white">Black → GND</text>
    <text x="390" y="560" font-size="11" fill="#f9e79f">JST connector</text>
  </g>

  <!-- ====== 6. Solar Panel ====== -->
  <g filter="url(#shadow)">
    <rect x="690" y="440" width="220" height="130" rx="10" fill="url(#solar-bg)"/>
    <text x="800" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Solar Panel</text>
    <text x="800" y="490" text-anchor="middle" font-size="11" fill="#1a252f">1W 5V 200mA</text>
    <text x="710" y="520" font-size="11" fill="#2c3e50">Red  → TP4056 IN+</text>
    <text x="710" y="540" font-size="11" fill="#2c3e50">Black → TP4056 IN- (GND)</text>
  </g>

  <!-- ====== 7. Voltage Regulator ====== -->
  <g filter="url(#shadow)">
    <rect x="370" y="630" width="200" height="120" rx="10" fill="url(#reg-bg)"/>
    <text x="470" y="658" text-anchor="middle" font-size="14" font-weight="bold" fill="white">AMS1117-3.3V</text>
    <text x="470" y="675" text-anchor="middle" font-size="11" fill="#fadbd8">Regulator</text>
    <text x="385" y="705" font-size="11" fill="white">IN  → 5V (from TP4056 OUT+)</text>
    <text x="385" y="725" font-size="11" fill="white">OUT → 3.3V → ESP32 VIN</text>
    <text x="385" y="740" font-size="11" fill="#f9e79f">GND → GND (common)</text>
  </g>

  <!-- ====== WIRES (connections) ====== -->

  <!-- GPS TX → ESP32 GPIO16 (RX2) -->
  <path d="M 255 285 C 300 285, 300 130, 615 130" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="390" y="110" width="90" height="18" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="435" y="123" text-anchor="middle" font-size="9" fill="#3498db">GPS TX → RX2</text>

  <!-- GPS RX ← ESP32 GPIO17 (TX2) -->
  <path d="M 615 160 C 580 160, 300 160, 255 270" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="385" y="145" width="90" height="18" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="430" y="158" text-anchor="middle" font-size="9" fill="#3498db">TX2 → GPS RX</text>

  <!-- SIM800L TX → ESP32 GPIO19 -->
  <path d="M 740 250 C 700 250, 650 350, 610 350" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="660" y="235" width="85" height="18" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="702" y="248" text-anchor="middle" font-size="9" fill="#3498db">GSM TX → RX</text>

  <!-- SIM800L RX ← ESP32 GPIO18 -->
  <path d="M 610 370 C 630 370, 700 270, 740 270" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="635" y="355" width="85" height="18" rx="4" fill="white" stroke="#3498db" stroke-width="1"/>
  <text x="677" y="368" text-anchor="middle" font-size="9" fill="#3498db">TX → GSM RX</text>

  <!-- GND rail (dashed line across bottom) -->
  <line x1="155" y1="380" x2="840" y2="380" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="500" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">GND (Common Ground) — All GND pins connected</text>

  <!-- 3.3V from ESP32 to GPS VCC -->
  <path d="M 355 375 C 320 375, 280 200, 255 200" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="250" y="160" width="85" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="292" y="173" text-anchor="middle" font-size="9" fill="#e74c3c">3.3V → GPS</text>

  <!-- SIM800L VCC from battery -->
  <path d="M 740 200 C 720 200, 700 420, 590 420" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="680" y="410" width="90" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="725" y="423" text-anchor="middle" font-size="9" fill="#e74c3c">BAT → GSM VCC</text>

  <!-- TP4056 BAT+ → LiPo + -->
  <path d="M 275 530 C 320 530, 320 515, 370 515" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="290" y="500" width="75" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="327" y="513" text-anchor="middle" font-size="9" fill="#e74c3c">BAT+</text>

  <!-- Solar Panel → TP4056 IN+ -->
  <path d="M 690 500 C 640 500, 640 490, 275 490" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="400" y="475" width="100" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="450" y="488" text-anchor="middle" font-size="9" fill="#e74c3c">Solar 5V → IN+</text>

  <!-- TP4056 OUT+ → AMS1117 IN -->
  <path d="M 275 590 C 320 590, 320 690, 370 690" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="280" y="665" width="85" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="322" y="678" text-anchor="middle" font-size="9" fill="#e74c3c">5V → Reg IN</text>

  <!-- AMS1117 OUT → ESP32 VIN -->
  <path d="M 370 660 C 340 660, 340 375, 350 375" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="295" y="365" width="85" height="18" rx="4" fill="white" stroke="#e74c3c" stroke-width="1"/>
  <text x="337" y="378" text-anchor="middle" font-size="9" fill="#e74c3c">3.3V → ESP32</text>

  <!-- Collar icon -->
  <g transform="translate(1050, 440)">
    <rect x="0" y="0" width="130" height="130" rx="65" fill="none" stroke="#7f8c8d" stroke-width="2" fill-opacity="0.1"/>
    <path d="M 30 20 Q 65 5 100 20" fill="none" stroke="#7f8c8d" stroke-width="3"/>
    <path d="M 30 110 Q 65 125 100 110" fill="none" stroke="#7f8c8d" stroke-width="3"/>
    <text x="65" y="55" text-anchor="middle" font-size="12" fill="#2c3e50">Collar</text>
    <text x="65" y="72" text-anchor="middle" font-size="11" fill="#7f8c8d">Assembly</text>
    <text x="65" y="90" text-anchor="middle" font-size="11" fill="#7f8c8d">(IP67 Box)</text>
    <rect x="35" y="100" width="60" height="3" rx="1.5" fill="#7f8c8d"/>
  </g>

  <!-- ====== ANTI-THEFT: Strap Sensor Detail ====== -->
  <g transform="translate(30, 630)">
    <rect x="0" y="0" width="520" height="140" rx="10" fill="#1a1a2e" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">ANTI-THEFT — Strap Continuity Sensor (ALL COLLARS)</text>

    <!-- Circuit diagram -->
    <text x="15" y="50" font-size="11" fill="#eee">ESP32 GPIO ──┬── 10k resistor ─── VCC (3.3V)</text>
    <text x="15" y="68" font-size="11" fill="#eee">                  │</text>
    <text x="15" y="86" font-size="11" fill="#eee">                  └── wire loop ────┤ Strap buckle ├──── GND</text>

    <text x="15" y="112" font-size="11" fill="#f9e79f">LOW = buckled (circuit closed through strap wire loop)</text>
    <text x="15" y="130" font-size="11" fill="#e74c3c">HIGH = breached (strap cut or unbuckled — loop broken)</text>
  </g>

  <!-- Strap wire annotations on ESP32 -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="180" height="50" rx="6" fill="#2c0a0a" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#e74c3c">STRAP SENSORS</text>
    <text x="90" y="33" text-anchor="middle" font-size="9" fill="#eee">Main collar: GPIO32 (INPUT_PULLUP)</text>
    <text x="90" y="45" text-anchor="middle" font-size="9" fill="#eee">Sub-collar:  GPIO33 (INPUT_PULLUP)</text>
  </g>

  <!-- Arrow from strap annotation to ESP32 -->
  <path d="M 620 105 C 620 105, 610 200, 480 200" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>

</svg>
